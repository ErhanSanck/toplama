<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Detaylı Takip Paneli</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #1a73e8; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .dogru-hucre { color: #28a745; font-weight: bold; }
        .yanlis-hucre { color: #dc3545; font-weight: bold; }
        .refresh-btn { background: #34A853; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right; }
    </style>
</head>
<body>

<div class="container">
    <button class="refresh-btn" onclick="verileriGetir()">Listeyi Güncelle</button>
    <h2>Öğrenci Çalışma Geçmişi</h2>
    
    <table id="logTable">
        <thead>
            <tr>
                <th>Tarih</th>
                <th>Saat</th>
                <th>Seviye</th>
                <th>Doğru</th>
                <th>Yanlış</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    const dbURL = "https://enesogrenci-91325-default-rtdb.firebaseio.com/gecmis.json";

    async function verileriGetir() {
        try {
            const response = await fetch(dbURL);
            const data = await response.json();
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = ""; // Tabloyu temizle

            if (data) {
                // Firebase verileri nesne olarak döndürür, diziye çevirip ters çevirelim (son eklenen üste)
                const veriler = Object.values(data).reverse();

                veriler.forEach(item => {
                    const row = `<tr>
                        <td>${item.tarih}</td>
                        <td>${item.saat}</td>
                        <td>${item.seviye}</td>
                        <td class="dogru-hucre">${item.dogru}</td>
                        <td class="yanlis-hucre">${item.yanlis}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = "<tr><td colspan='5'>Henüz kayıt bulunamadı.</td></tr>";
            }
        } catch (error) {
            console.error("Veri çekme hatası:", error);
        }
    }

    // Sayfa açıldığında verileri getir
    verileriGetir();
</script>
</body>
</html>
